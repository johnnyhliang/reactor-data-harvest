<!doctype html>
<html lang=en><meta charset=utf-8><meta name=viewport content=width=device-width>
<title>Keep or drop</title>
<style>
body{font:16px system-ui,sans-serif;margin:0 auto;max-width:1000px;padding:0 1rem 2rem;background:#f4f5f6;color:#1b242c}
header{position:sticky;top:0;background:#f4f5f6;padding:.6rem 0;border-bottom:1px solid #ccc;z-index:2}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
button{padding:.45rem .8rem} button.on{background:#1d3550;color:#fff}
img{width:100%;max-height:70vh;object-fit:contain;background:#fff;border:3px solid #ccc;border-radius:8px}
.keep img{border-color:#1f8a4c}.drop img{border-color:#c0392b}
.group{font-weight:650}.cap{color:#333}
#mark{font-weight:650;margin:.2rem 0}
#mark.keep{color:#1f8a4c}#mark.drop{color:#c0392b}#mark.none{color:#667}
small{color:#667}
</style>
<header>
<div class=row><strong id=count></strong>
<button id=prev>Previous</button><button id=next>Next</button>
<label>Show <select id=filt><option value=ask>Needs your call</option><option value=all>All 61</option><option value=keep>Suggested keep</option><option value=drop>Suggested drop</option></select></label>
<button id=save>Download labels</button></div>
<p><b>S</b> keep &nbsp; <b>D</b> drop &nbsp; <b>←</b> <b>→</b> move. A vote advances. Suggested labels are already filled in; change any you disagree with.</p>
</header>
<p class=group id=group></p>
<p id=mark></p>
<img id="pic" alt="">
<p id=name></p>
<p class=cap id=cap></p>
<p><button id=k>S keep</button> <button id=d>D drop</button></p>

 "suggestion": "ask"}, {"file_name": "osti_3685193_021.png", "url": "images/osti_3685193_021.png", "caption": "Fig. 24. The final version of the FEB board with its low voltage mezzanine. One clearly sees the separation between the analogue domain containing the analogue connectors and the CITIROC chips (at the top), and the digital area, containing the FPGA (center and bottom).", "group": "T2K detector hardware (not a reactor)", "suggestion": "ask"}, {"file_name": "osti_3685193_023.jpeg", "url": "images/osti_3685193_023.jpeg", "caption": "Fig. 28. The MPPC signal digitised by the FEB clearly shows the different peak corresponding to different numbers of photoelectrons (up to 9 in this picture). A zoom on this plot (right) allows to see that no significant effect is seen in these photoelectron peaks recorded with 0.2 T and 0.4 T magnetic fields in different orientations.", "group": "T2K detector hardware (not a reactor)", "suggestion": "ask"}, {"file_name": "osti_3685193_024.jpeg", "url": "images/osti_3685193_024.jpeg", "caption": "Fig. 29. Left: crates shown from the back with cooling lines and bars. Right: crates shown from the front before the installation of the FEBs in crates 0 and 2, such that the cooling bars are visible.", "group": "T2K detector hardware (not a reactor)", "suggestion": "ask"}, {"file_name": "osti_3685193_025.jpeg", "url": "images/osti_3685193_025.jpeg", "caption": "Fig. 31. Left: model of the aluminium cooling plate (blue) and T-Flex (pink). Right: an FEB equipped with its cooling plate and its low voltage power mezzanine.", "group": "T2K detector hardware (not a reactor)", "suggestion": "ask"}, {"file_name": "osti_3685193_026.jpeg", "url": "images/osti_3685193_026.jpeg", "caption": "Fig. 35. Photograph of an OCB: 1. Main power; 2. Z-Turn SoC; 3. Current summer (analogue sum); 4. MCB interface; 5. Clock cleaner; 6. Global enable; 7. Bias voltage input; 8. Backplane connector (connection with FEBs via backplane).", "group": "T2K detector hardware (not a reactor)", "suggestion": "ask"}, {"file_name": "osti_17076844_000.jpeg", "url": "images/osti_17076844_000.jpeg", "caption": "Fig. 1. SCALE model of a fuel pebble and a TRISO fuel particle.", "group": "Already labeled by the first pass", "suggestion": "keep"}, {"file_name": "osti_17076844_001.jpeg", "url": "images/osti_17076844_001.jpeg", "caption": "Fig. 2. 3D view of the SCALE model of Core 4.", "group": "Already labeled by the first pass", "suggestion": "keep"}, {"file_name": "osti_17076844_005.jpeg", "url": "images/osti_17076844_005.jpeg", "caption": "Fig. 11. SCALE model highlighting locations of the control rods in HTR- PROTEUS.", "group": "Already labeled by the first pass", "suggestion": "keep"}, {"file_name": "osti_17120806_002.png", "url": "images/osti_17120806_002.png", "caption": "Figure 3. Measurement setup in the East Radiography station", "group": "Already labeled by the first pass", "suggestion": "keep"}, {"file_name": "osti_17120806_005.png", "url": "images/osti_17120806_005.png", "caption": "Figure 7. Horizontal cut of the measurement setup.", "group": "Already labeled by the first pass", "suggestion": "keep"}, {"file_name": "osti_17120806_010.png", "url": "images/osti_17120806_010.png", "caption": "Figure 16 Distribution of total Pu mass in fuel rods for a single 17×17 PWR fuel assembly. The empty", "group": "Already labeled by the first pass", "suggestion": "drop"}, {"file_name": "osti_3018379_000.png", "url": "images/osti_3018379_000.png", "caption": "Figure 2. LFR control rod assembly types", "group": "Already labeled by the first pass", "suggestion": "drop"}, {"file_name": "osti_3018379_006.png", "url": "images/osti_3018379_006.png", "caption": "Figure 8. Geometry shared by optimal cases from Table VII", "group": "Already labeled by the first pass", "suggestion": "drop"}, {"file_name": "osti_3023581_008.png", "url": "images/osti_3023581_008.png", "caption": "Figure 10: FeCrAl cans after they were cut open to remove the YH. 800°C cans are along the top, with the 900°C specimens along the bottom in order of coating thickness", "group": "Already labeled by the first pass", "suggestion": "keep"}, {"file_name": "osti_3375250_000.png", "url": "images/osti_3375250_000.png", "caption": "Figure 1. Cross-sectional views of the baseline BWR FA Serpent model in different axial zones.", "group": "Already labeled by the first pass", "suggestion": "keep"}, {"file_name": "osti_3375250_001.jpeg", "url": "images/osti_3375250_001.jpeg", "caption": "Figure 2. Cross-sectional view of the BWR FA Serpent model with LLFP targets installed.", "group": "Already labeled by the first pass", "suggestion": "keep"}, {"file_name": "osti_3375250_002.png", "url": "images/osti_3375250_002.png", "caption": "Figure 3. The (a) x-y and (b) x-z cross-sectional views of the baseline ARC Serpent model.", "group": "Already labeled by the first pass", "suggestion": "keep"}, {"file_name": "osti_3375250_003.png", "url": "images/osti_3375250_003.png", "caption": "Figure 4. Material layers surrounding the ARC plasma region with LLFP targets in place.", "group": "Already labeled by the first pass", "suggestion": "keep"}, {"file_name": "osti_3384931_000.jpeg", "url": "images/osti_3384931_000.jpeg", "caption": "Fig. 1. Reference radial layout of the HPMR configuration, showing core and reflector regions and control drum locations.", "group": "Already labeled by the first pass", "suggestion": "keep"}, {"file_name": "osti_3384931_001.jpeg", "url": "images/osti_3384931_001.jpeg", "caption": "Fig. 2. Fuel assembly (block) types used in the reference HPMR configuration (standard and control rod assemblies).", "group": "Already labeled by the first pass", "suggestion": "keep"}, {"file_name": "osti_3384931_005.jpeg", "url": "images/osti_3384931_005.jpeg", "caption": "Fig. 6. Flowchart of the Python-driven dynamic depletion approach.", "group": "Already labeled by the first pass", "suggestion": "drop"}, {"file_name": "osti_3384931_012.jpeg", "url": "images/osti_3384931_012.jpeg", "caption": "Fig. 13. Calculated 𝑘eff for submerged irradiated-core configurations under partial external immersion and full immersion with internal water ingress. Case definitions are provided in Table 6. The irradiated isotopic composition was reduced to selected key nuclides following NUREG-2216 guidance.", "group": "Already labeled by the first pass", "suggestion": "keep"}, {"file_name": "osti_3384956_000.jpeg", "url": "images/osti_3384956_000.jpeg", "caption": "FIGURE 1 A GNF2 10 × 10 assembly. This diagram is illustrative only and is not to scale.", "group": "Already labeled by the first pass", "suggestion": "keep"}, {"file_name": "osti_3431792_000.jpeg", "url": "images/osti_3431792_000.jpeg", "caption": "Figure 1- (a) Computer Aided Design (CAD) of the prototype | (b) Sketch of a", "group": "Already labeled by the first pass", "suggestion": "keep"}, {"file_name": "osti_3818008_000.png", "url": "images/osti_3818008_000.png", "caption": "Figure 1: 2D geometry of homogenized core, where elements sharing same color represent assemblies with shared cross section and SPH-based equivalence properties.", "group": "Already labeled by the first pass", "suggestion": "drop"}, {"file_name": "osti_3818008_004.png", "url": "images/osti_3818008_004.png", "caption": "Figure 5: 2D geometry of (a) SIMBA core and (b) SIMBA fuel assembly.", "group": "Already labeled by the first pass", "suggestion": "keep"}, {"file_name": "osti_3818008_005.png", "url": "images/osti_3818008_005.png", "caption": "Figure 6: Diagram showing assembly location and pin locations where form functions are calculated for the analysis in Sections 3.3.1 and 3.3.2. These four fuel pin locations (fuel pins are colored in green) will be referenced based on which ring of pins they belong to in the pin lattice of the fuel assembly.", "group": "Already labeled by the first pass", "suggestion": "keep"}, {"file_name": "osti_3818008_011.png", "url": "images/osti_3818008_011.png", "caption": "Figure 13: Spatial distribution of pin power errors for the three representative fuel assemblies shown in Figure 12. Results are shown for the tabulation grid point 𝑇𝑓𝑢𝑒𝑙= 775𝐾, 𝑇𝑚𝑜𝑑;𝑚𝑜𝑛𝑜𝑙𝑖𝑡ℎ= 775𝐾, and 𝑇𝑟𝑒𝑓𝑙;𝑐𝑑= 475𝐾. The core-wide RMS error in pin powers is 0.5% and the maximum absolute pin error for a single pin is 1.9%", "group": "Already labeled by the first pass", "suggestion": "drop"}, {"file_name": "osti_3818008_014.png", "url": "images/osti_3818008_014.png", "caption": "Figure 17: Converged map of (a) heterogeneous material temperatures (K) and (b) pin power densities (W/m3), assuming a pin power reconstruction workflow with thermal feedback through the MOOSE Heat Transfer Module.", "group": "Already labeled by the first pass", "suggestion": "drop"}];
const key = 'reactor-label-v1';
let votes = {};
try { votes = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) {}
for (const x of items) if (!votes[x.file_name] && x.suggestion !== 'ask') votes[x.file_name] = x.suggestion;
let i = 0;
const el = id => document.getElementById(id);
function list() {
  const f = el('filt').value;
  return items.filter(x => f === 'all' ? true : f === 'ask' ? x.suggestion === 'ask' : votes[x.file_name] === f || (f !== 'ask' && x.suggestion === f && !votes[x.file_name]));
}
function wrap(n, len) { return ((n % len) + len) % len; }
function show() {
  const rows = list();
  if (!rows.length) { el('group').textContent = 'Nothing in this queue.'; el('pic').removeAttribute('src'); return; }
  i = wrap(i, rows.length);
  const x = rows[i];
  const v = votes[x.file_name] || '';
  const decided = rows.filter(y => votes[y.file_name]).length;
  el('count').textContent = (i+1) + ' / ' + rows.length + '   decided ' + decided + '/' + rows.length;
  el('group').textContent = x.group;
  el('mark').className = v || 'none';
  el('mark').textContent = v ? ('Already marked ' + v.toUpperCase() + '. Press the other key to change it.') : 'Not marked yet.';
  el('pic').src = x.url;
  document.body.className = v;
  el('name').textContent = x.file_name;
  el('cap').textContent = x.caption;
  el('k').className = v === 'keep' ? 'on' : '';
  el('d').className = v === 'drop' ? 'on' : '';
}
function vote(v) {
  const rows = list();
  const x = rows[wrap(i, rows.length)];
  if (!x) return;
  votes[x.file_name] = v;
  localStorage.setItem(key, JSON.stringify(votes));
  i = wrap(i + 1, rows.length);
  show();
}
el('k').onclick = () => vote('keep');
el('d').onclick = () => vote('drop');
el('prev').onclick = () => { i = wrap(i - 1, list().length); show(); };
el('next').onclick = () => { i = wrap(i + 1, list().length); show(); };
el('filt').onchange = () => { i = 0; show(); };
el('save').onclick = () => {
  const lines = items.map(x => JSON.stringify({file_name: x.file_name, label: votes[x.file_name] || 'unlabeled', group: x.group}));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\n')+'\n'], {type:'application/x-ndjson'}));
  a.download = 'seed_labels_reviewed.jsonl';
  a.click();
};
document.addEventListener('keydown', ev => {
  if (ev.target.matches('select')) return;
  if (ev.key === 's' || ev.key === 'S') vote('keep');
  else if (ev.key === 'd' || ev.key === 'D') vote('drop');
  else if (ev.key === 'ArrowRight') { i = wrap(i + 1, list().length); show(); }
  else if (ev.key === 'ArrowLeft') { i = wrap(i - 1, list().length); show(); }
});
show();
</script>
